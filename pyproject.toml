[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zfstool"
version = "1!0.0.1793574943"
description = "Common functions for working with zfs"
authors = [
    { name = "Justin Keogh", email = "github.com@v6y.net" },
]
dependencies = [
    "click",
    "asserttool @ git+https://github.com/jakeogh/asserttool@4bd23a06c2161e488415acde89c29537e6720cc1",
    "click-auto-help @ git+https://github.com/jakeogh/click-auto-help@9745b515e7beaaa046f802b5b3ad516720fc2475",
    "clicktool @ git+https://github.com/jakeogh/clicktool@fe263331c27a4b392ce04261d83267759098d6b7",
    "devicetool @ git+https://github.com/jakeogh/devicetool@c6b17d66d25cf20f4a492e6c483b1c536954d649",
    "eprint @ git+https://github.com/jakeogh/eprint@6ee1deca0c24b684eb5093247d6bd22e11f1b057",
    "hs @ git+https://github.com/jakeogh/hs@b6f75452351ccc668bc87c6f03d73268ff7a0b24",
    "itertool @ git+https://github.com/jakeogh/itertool@f46b317d3d2d8e2a6d55193c25caf3f5ea9c5b04",
    "mounttool @ git+https://github.com/jakeogh/mounttool@1dc451c21a89a45ffb69161a6ed7432c8192d9a6",
    "timestamptool @ git+https://github.com/jakeogh/timestamptool@4abe95a6ce95530eb1e6c06f16bff1f851ebee29",
]
license = "ISC"
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/jakeogh/zfstool"

[project.scripts]
zfstool = "zfstool.zfstool:cli"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
exclude = [
    "tests",
]

[tool.setuptools.package-data]
zfstool = [
    "py.typed",
]
